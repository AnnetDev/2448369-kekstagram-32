<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- <base href="/2448369-kekstagram-32/"> -->
  <link rel="stylesheet" href="/vendor/nouislider/nouislider.css">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <title>Kekstagram</title>
</head>

<body>
  <main>

    <!-- Image filter for other users' photos -->
    <section class="img-filters  img-filters--inactive  container">
      <h2 class="img-filters__title  visually-hidden">Photo filter</h2>
      <form class="img-filters__form" action="index.html" method="get" autocomplete="off">
        <button type=button class="img-filters__button  img-filters__button--active" id="filter-default">Default</button>
        <button type=button class="img-filters__button" id="filter-random">Random</button>
        <button type=button class="img-filters__button" id="filter-discussed">Most discussed</button>
      </form>
    </section>

    <!-- Container for other users' images -->
    <section class="pictures  container">
      <h2 class="pictures__title  visually-hidden">Other users' photos</h2>

      <!-- Image upload field -->
      <section class="img-upload">
        <div class="img-upload__wrapper">
          <h2 class="img-upload__title  visually-hidden">Upload photo</h2>
          <form class="img-upload__form" method="post" enctype="multipart/form-data"
            action="https://32.javascript.htmlacademy.pro/kekstagram" id="upload-select-image" autocomplete="off">

            <!-- Initial state of the upload field -->
            <fieldset class="img-upload__start">
              <input type="file" id="upload-file" class="img-upload__input  visually-hidden" name="filename" accept="image/png, image/jpeg" required>
              <label for="upload-file" class="img-upload__label  img-upload__control">Upload</label>
            </fieldset>

            <!-- Image editing form -->
            <div class="img-upload__overlay  hidden">
              <div class="img-upload__wrapper">
                <div class="img-upload__preview-container">

                  <!-- Image scale controls -->
                  <fieldset class="img-upload__scale  scale">
                    <button type="button" class="scale__control  scale__control--smaller">Zoom out</button>
                    <input type="text" class="scale__control  scale__control--value" value="100%" title="Image Scale"
                      name="scale" readonly>
                    <button type="button" class="scale__control  scale__control--bigger">Zoom in</button>
                  </fieldset>

                  <!-- Image preview -->
                  <div class="img-upload__preview">
                    <img src="img/upload-default-image.jpg" alt="Photo preview">
                  </div>

                  <!-- Effect depth slider -->
                  <fieldset class="img-upload__effect-level  effect-level">
                    <input class="effect-level__value" type="number" step="any" name="effect-level" value="">
                    <div class="effect-level__slider"></div>
                  </fieldset>

                  <!-- Close button for the image editing form -->
                  <button type="reset" class="img-upload__cancel  cancel" id="upload-cancel">Close</button>
                </div>

                <!-- Apply effect to image -->
                <fieldset class="img-upload__effects  effects">
                  <ul class="effects__list">
                    <li class="effects__item">
                      <input type="radio" class="effects__radio  visually-hidden" name="effect" id="effect-none"
                        value="none" checked>
                      <label for="effect-none" class="effects__label">
                        <span class="effects__preview  effects__preview--none">Preview without effect</span>
                        Original
                      </label>
                    </li>
                    <li class="effects__item">
                      <input type="radio" class="effects__radio  visually-hidden" name="effect" id="effect-chrome"
                        value="chrome">
                      <label for="effect-chrome" class="effects__label">
                        <span class="effects__preview  effects__preview--chrome">Chrome effect preview</span>
                        Chrome
                      </label>
                    </li>
                    <li class="effects__item">
                      <input type="radio" class="effects__radio  visually-hidden" name="effect" id="effect-sepia"
                        value="sepia">
                      <label for="effect-sepia" class="effects__label">
                        <span class="effects__preview  effects__preview--sepia">Sepia effect preview</span>
                        Sepia
                      </label>
                    </li>
                    <li class="effects__item">
                      <input type="radio" class="effects__radio  visually-hidden" name="effect" id="effect-marvin"
                        value="marvin">
                      <label for="effect-marvin" class="effects__label">
                        <span class="effects__preview  effects__preview--marvin">Marvin effect preview</span>
                        Marvin
                      </label>
                    </li>
                    <li class="effects__item">
                      <input type="radio" class="effects__radio  visually-hidden" name="effect" id="effect-phobos"
                        value="phobos">
                      <label for="effect-phobos" class="effects__label">
                        <span class="effects__preview  effects__preview--phobos">Phobos effect preview</span>
                        Phobos
                      </label>
                    </li>
                    <li class="effects__item">
                      <input type="radio" class="effects__radio  visually-hidden" name="effect" id="effect-heat"
                        value="heat">
                      <label for="effect-heat" class="effects__label">
                        <span class="effects__preview  effects__preview--heat">Heat effect preview</span>
                        Heat
                      </label>
                    </li>
                  </ul>
                </fieldset>

                <!-- Add hashtags and comment to image -->
                <fieldset class="img-upload__text text">
                  <div class="img-upload__field-wrapper">
                    <input class="text__hashtags" name="hashtags" placeholder="#HashTag">
                  </div>
                  <div class="img-upload__field-wrapper">
                    <textarea class="text__description" name="description" placeholder="Your comment..."
                      data-pristine-maxlength="140"
                      data-pristine-maxlength-message="Comment cannot be longer than 140 characters"></textarea>
                  </div>
                </fieldset>

                <!-- Submit button -->
                <button type="submit" class="img-upload__submit" id="upload-submit">Publish</button>
              </div>
            </div>
          </form>
        </div>
      </section>

      <!-- Other users' images will be rendered here -->

    </section>

    <!-- Fullscreen image view -->
    <section class="big-picture  overlay  hidden">
      <h2 class="big-picture__title  visually-hidden">Photo view</h2>
      <div class="big-picture__preview">

        <!-- Image display -->
        <div class="big-picture__img">
          <img src="img/logo-background-3.jpg" alt="Girl on the beach" width="600" height="600">
        </div>

        <!-- Image info: caption, comments, likes count -->
        <div class="big-picture__social  social">
          <div class="social__header">
            <img class="social__picture" src="img/avatar-1.svg" alt="Photo author avatar" width="35" height="35">
            <p class="social__caption">Testing the new camera! =)</p>
            <p class="social__likes">Likes <span class="likes-count">356</span></p>
          </div>

          <!-- Image comments -->
          <div class="social__comment-count"><span class="social__comment-shown-count">5</span> of <span
              class="social__comment-total-count">125</span> comments</div>
          <ul class="social__comments">
            <li class="social__comment">
              <img class="social__picture" src="img/avatar-4.svg" alt="Commenter avatar" width="35"
                height="35">
              <p class="social__text">Amazing photo! How did you manage that?</p>
            </li>
            <li class="social__comment">
              <img class="social__picture" src="img/avatar-3.svg" alt="Commenter avatar" width="35"
                height="35">
              <p class="social__text">That's Photoshop!!!!!!!!</p>
            </li>
          </ul>

          <!-- Load more comments button -->
          <button type="button" class="social__comments-loader  comments-loader">Load more</button>

          <!-- Comment submission form -->
          <div class="social__footer">
            <img class="social__picture" src="img/avatar-6.svg" alt="Commenter avatar" width="35"
              height="35">
            <input type="text" class="social__footer-text" placeholder="Your comment...">
            <button type="button" class="social__footer-btn" name="button">Send</button>
          </div>
        </div>

        <!-- Close fullscreen view button -->
        <button type="reset" class="big-picture__cancel  cancel" id="picture-cancel">Close</button>
      </div>
    </section>
  </main>

  <footer class="page-footer  container">
    <div class="page-footer__wrapper">
      <div class="page-footer__copyright  copyright">
        <a class="copyright__link  copyright__link--image" href="https://htmlacademy.ru/intensive/javascript"><img
            src="img/htmla-logo.svg" width="130" height="45" alt="HTML Academy"></a>
        <p>Made at <a class="copyright__link  copyright__link--text"
            href="https://htmlacademy.ru/intensive/javascript">HTML Academy</a></p>
      </div>
      <ul class="page-footer__contacts  contacts">
        <li><a href="https://twitter.com/htmlacademy_ru" class="contacts__link  contacts__link--twitter">Twitter</a>
        </li>
        <li><a href="https://vk.com/htmlacademy" class="contacts__link  contacts__link--vk">VK</a></li>
      </ul>
    </div>
  </footer>

  <!-- User photo thumbnail template -->
  <template id="picture">
    <a href="#" class="picture">
      <img class="picture__img" src="" width="182" height="182" alt="User photo">
      <p class="picture__info">
        <span class="picture__comments"></span>
        <span class="picture__likes"></span>
      </p>
    </a>
  </template>

  <!-- Image upload error message -->
  <template id="error">
    <section class="error">
      <div class="error__inner">
        <h2 class="error__title">File upload error</h2>
        <button type="button" class="error__button">Try again</button>
      </div>
    </section>
  </template>

  <!-- Image upload success message -->
  <template id="success">
    <section class="success">
      <div class="success__inner">
        <h2 class="success__title">Image uploaded successfully</h2>
        <button type="button" class="success__button">Awesome!</button>
      </div>
    </section>
  </template>

  <!-- Data loading error message -->
  <template id="data-error">
    <section class="data-error">
      <h2 class="data-error__title">Failed to load data</h2>
    </section>
  </template>

  <template id="comment">
    <li class="social__comment">
      <img class="social__picture" src="{{avatar}}" alt="{{commenter name}}" width="35" height="35">
      <p class="social__text">{{comment text}}</p>
    </li>
  </template>

  <script src="/vendor/pristine/pristine.min.js"></script>
  <script src="/vendor/nouislider/nouislider.js"></script>
  <script src="js/main.js" type="module" defer></script>
</body>

</html>
